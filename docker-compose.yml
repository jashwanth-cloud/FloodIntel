version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: floodintel_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-floodintel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-floodintel_password}
      POSTGRES_DB: ${DB_NAME:-floodintel_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
